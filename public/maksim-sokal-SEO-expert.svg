<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Strategy Navy to Sky Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D18" />
      <stop offset="50%" stop-color="#1B1938" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Growth Bar Gradient -->
    <linearGradient id="barGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow & Shadow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Terminal Style -->
    <style>
      .bg-circle { fill: url(#bgGrad); }
      .orbit-ring { fill: none; stroke: #38BDF8; stroke-width: 6; stroke-dasharray: 16, 8; }
      .bar { fill: url(#barGrad); }
      .trend { stroke: #FFFFFF; stroke-width: 10; stroke-linecap: round; fill: none; }
      .hub-node { fill: #FFFFFF; filter: drop-shadow(0px 0px 14px #38BDF8); }
    </style>
  </defs>

  <!-- Base Favicon Square/Circle -->
  <rect width="512" height="512" rx="112" class="bg-circle" />

  <!-- Orbit / Search Signal Ring -->
  <g filter="url(#glow)" opacity="0.9">
    <circle cx="256" cy="256" r="150" class="orbit-ring" />
    <line x1="106" y1="256" x2="406" y2="256" class="orbit-ring" opacity="0.3" />
  </g>

  <!-- Organic Growth Bars (Analytics) -->
  <g>
    <rect x="150" y="300" width="42" height="88" rx="8" class="bar" />
    <rect x="205" y="252" width="42" height="136" rx="8" class="bar" />
    <rect x="260" y="198" width="42" height="190" rx="8" class="bar" />
    <polyline points="171,300 226,252 281,198" class="trend" />
  </g>

  <!-- Search Magnifier (Strategy Focus) -->
  <g>
    <circle cx="340" cy="172" r="52" fill="none" stroke="#FFFFFF" stroke-width="14" />
    <line x1="378" y1="210" x2="414" y2="246" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
    <circle cx="340" cy="172" r="20" class="hub-node" />
  </g>
</svg>
